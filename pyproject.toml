[project]
name = "erpnext_project_access"
authors = [
    { name = "Piyush Mehta" }
]
description = "Scoped Project and Task access control with controlled Task workflow for ERPNext"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
license = { text = "GPL-3.0-only" }
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "W191"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
